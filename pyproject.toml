[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advisor"
version = "0.1.0"
description = "Market watch for companies eligible to the French PEA PME ETI plan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
history = ["yfinance>=0.2.40"]
dev = ["pytest>=8"]

[project.scripts]
advisor = "advisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
