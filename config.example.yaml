# Copy this file to config.yaml and adjust it.
# Relative paths are resolved against the directory of this file.
# The ADVISOR_CONFIG environment variable can point to another file.

paths:
  database: data/advisor.db
  lists: data/lists                 # Euronext files dropped in by hand
  overrides: overrides.yaml         # manual inclusions and exclusions
  mappings: mappings.csv            # ISIN <-> Boursorama / Yahoo codes, editable by hand
  exports: data/exports
  vault: vault                      # Obsidian vault (Inbox/, Journal/...); can point to an existing one
  sources: sources.yaml             # RSS feeds, see sources.example.yaml

liquidity:
  window_sessions: 63               # about 3 months of trading
  min_sessions: 20                  # below this, status is "unknown"
  median_turnover_entry: 20000      # EUR per day to enter the liquid universe
  median_turnover_exit: 15000       # EUR per day below which a liquid stock drops out
  min_active_session_ratio: 0.95
  max_staleness_days: 10            # latest session older than this: status "unknown"

# Conversion rates to euros, updated by hand (1 unit = x EUR). Codes are case-sensitive
# ("GBp" is pence). A stock quoted in a currency missing here gets status "unknown".
currencies:
  EUR: 1.0
  NOK: 0.085

boursorama:
  url: "https://www.boursorama.com/bourse/actions/cotations/"
  market_filter: PEAPME
  max_pages: 60
  pause_seconds: 2.0
  # Stocks the name match misses are looked up on their own page (one request each).
  max_isin_lookups: 200        # per run, so the first run stays reasonable
  isin_lookup_retry_days: 30   # page of a stock still unmatched is read again after this

# News collection (`advisor collect`, also run by `advisor daily`). No language model is called.
collect:
  pause_seconds: 1.0           # between two requests to the same kind of source
  timeout_seconds: 20
  max_article_fetches: 300     # article pages read per run; the rest waits for the next run
  max_age_days: 30             # older collected articles are skipped (manual adds are never)
  min_text_chars: 800          # shorter text from a feed is treated as paywalled
  paywall_markers:             # any of these in the extracted text: treated as paywalled
    - "réservé aux abonnés"
    - "article réservé"
    - "contenu réservé"
    - "abonnez-vous pour lire"
    - "pour lire la suite"
    - "déjà abonné"
  boursorama_news:             # the news page of each stock (press releases, AOF dispatches)
    enabled: true
    url: "https://www.boursorama.com/cours/actualites/{code}/"
    pages_per_run: 150         # stocks visited per run, the least recently visited first
    first_visit_items: 5       # a first visit only takes the latest items, not years of history
    liquid_only: true          # only stocks of the liquid universe

# Signal extraction (`advisor extract`, also run by `advisor daily` when ANTHROPIC_API_KEY is set).
# Each ready article is sent to the model, which returns signals as JSON; a signal is kept only
# if its quote is found word for word in the article.
llm:
  model: claude-haiku-5-5
  effort: low                  # low, medium, high: more thinking costs more output tokens
  max_tokens: 8000             # per answer, thinking included
  max_documents_per_run: 150
  max_text_chars: 30000        # longer articles are cut
  daily_budget_usd: 0.50       # the run stops once the estimated cost of the day reaches this
  price_input_per_mtok: 0.10   # USD per million tokens, used for the cost estimate only
  price_output_per_mtok: 0.50
  # Macro factors the model may target (key: meaning). The defaults are listed in
  # src/advisor/config.py; add yours here, or set one to null to drop it.
  # factors:
  #   housing: "property prices and construction"
  #   currency: null
